<style>
  :root{
    --bg:#0a1117; --panel:#0f1a24; --panel2:#14222f; --line:#1e3345;
    --txt:#dbe7f0; --muted:#7f96a8; --dim:#5b7186;
    --up:#e0453a; --down:#2fa877; --gold:#e0a94f; --gold2:#f0c98a;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 60px}

  /* ===== Header ===== */
  header{padding:26px 0 6px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#14222f,#0d1b2a);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .logo svg{width:22px;height:22px}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:.5px}
  .brand .tag{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1.5px}
  .headmeta{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:18px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .hstat{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
  .hstat .k{color:var(--dim);letter-spacing:.5px}
  .hstat .v{color:var(--gold);font-weight:600;font-size:13px}
  .hstat .v.up{color:var(--up)} .hstat .v.down{color:var(--down)}
  .hstat .sep{color:var(--dim)}

  /* ===== Overview cards ===== */
  .ov-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px}
  .ov-title h2{font-size:15px;font-weight:600;letter-spacing:1px}
  .ov-title span{font-size:11px;color:var(--dim)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .group-hd{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;margin:16px 0 2px;font-size:12.5px;font-weight:600;color:var(--gold);letter-spacing:1px}
  .group-hd:first-child{margin-top:0}
  .group-hd::after{content:"";flex:1;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:stretch}
  .card-main{flex:1;min-width:0}
  .card .mini{width:96px;flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px dashed var(--line);padding-left:12px}
  .card .mini svg{display:block}
  .card .mini .mlab{font-size:9px;color:var(--dim);margin-top:5px;letter-spacing:.4px;white-space:nowrap}
  .card:hover{transform:translateY(-2px);border-color:var(--gold2);box-shadow:0 10px 28px rgba(0,0,0,.45)}
  .card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 28px rgba(0,0,0,.45)}
  .card .cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .card .nm{font-size:13px;color:var(--muted);font-weight:500}
  .card .num{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .card .unit{font-size:12px;color:var(--muted);margin-left:3px;font-weight:400}
  .card .chg{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .card .chg.up{color:var(--up)} .card .chg.down{color:var(--down)}
  .card .adv{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
  .card .ratio{font-size:11px;color:var(--muted);margin-top:3px}
  .card .ratio b{color:var(--gold);font-variant-numeric:tabular-nums}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;letter-spacing:.5px}
  .tag.buy{background:rgba(224,69,58,.14);color:#ff7a6f;border:1px solid rgba(224,69,58,.35)}
  .tag.sell{background:rgba(47,168,119,.14);color:#52d5a3;border:1px solid rgba(47,168,119,.35)}
  .tag.hold{background:rgba(224,169,79,.14);color:var(--gold2);border:1px solid rgba(224,169,79,.35)}
  .tag.watch{background:rgba(127,150,168,.14);color:#a9bccb;border:1px solid rgba(127,150,168,.35)}
  .card .dtt{font-size:10.5px;color:var(--dim)}

  /* ===== Detail ===== */
  .detail{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .d-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  .d-title{display:flex;align-items:center;gap:10px}
  .d-title h3{font-size:17px;font-weight:700}
  .d-title .sub{font-size:11px;color:var(--dim);background:var(--panel2);padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
  .d-quote{text-align:right}
  .d-quote .pv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .d-quote .pc{font-size:12.5px;font-weight:600;margin-left:6px}
  .d-quote .pc.up{color:var(--up)} .d-quote .pc.down{color:var(--down)}
  .d-time{font-size:11px;color:var(--dim);margin-top:3px}
  .chartbox{padding:14px 16px 6px}
  #chartMain{width:100%;height:360px}
  .d-body{padding:6px 18px 18px}
  .d-row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
  .d-row:last-child{border-bottom:none}
  .d-row .k{color:var(--muted);font-weight:500;letter-spacing:.3px}
  .d-row .v{color:var(--txt)}
  .d-row .v b{color:var(--gold);font-weight:600}
  .d-row .v.up{color:var(--up)} .d-row .v.down{color:var(--down)}

  /* ===== 基金网格（明细区，每只基金大模块） ===== */
  .fund-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:2px 4px 8px}
  .fund-grp-hd{display:flex;align-items:baseline;gap:8px;margin:14px 2px 4px;font-size:12.5px;font-weight:600;color:var(--gold);letter-spacing:1px}
  .fund-grp-hd::after{content:"";flex:1;height:1px;background:var(--line)}
  .fund-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
  .fund-card .fc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .fund-card .fc-name{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.3}
  .fund-card .fc-type{font-size:10px;color:var(--dim);background:var(--panel);padding:2px 7px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
  .fund-card .fc-num{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .fund-card .fc-nav{font-size:19px;font-weight:700}
  .fund-card .fc-chg{font-size:12px;font-weight:600}
  .fund-card .fc-chg.up{color:var(--up)} .fund-card .fc-chg.down{color:var(--down)}
  .fund-card .fc-wave{display:flex;justify-content:center;border-top:1px dashed var(--line);padding-top:8px}
  .fund-card .fc-wave svg{display:block}
  .fund-card .fc-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim)}
  .fund-card .fc-foot .rng{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .fund-card .fc-foot .rng.up{color:var(--up)} .fund-card .fc-foot .rng.down{color:var(--down)}

  @media(max-width:480px){ .fund-grid{grid-template-columns:1fr} }

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 10px}
  .tab{padding:7px 13px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:all .15s}

  .tab.active{color:var(--gold);border-color:var(--gold);background:rgba(224,169,79,.08);font-weight:600}
  .footnote{margin-top:34px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.7}
  .footnote b{color:var(--gold)}

  @media(max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .card .num{font-size:21px}
    .headmeta{gap:8px 14px}
    .card .mini{width:84px;flex:0 0 84px}
  }
  @media(max-width:480px){
    .cards{grid-template-columns:1fr}
    .d-head{flex-direction:column;align-items:flex-start}
    .d-quote{text-align:left}
    #chartMain{height:300px}
    .card .mini{width:92px;flex:0 0 92px}
  }
</style>
</head>

function seriesOf(a){
  if(a.type==="k"||a.type==="bond") return a.ohlc.map(d=>d[3]); // 收盘价 / 收益率
  if(a.type==="bondpair") return a.us10y;                // 美债10Y核心
  if(a.type==="fxrmb") return a.usdcny;            // 美元中间价
  if(a.type==="housing") return a.hprice;          // 房价月度
  return null;
}
function spark(a){
  const s=seriesOf(a); if(!s||s.length<2) return null;
  const n=a.type==="housing"?12:(a.type==="fxrmb"?s.length:30), data=s.slice(-n);
  const w=96,h=44,pad=3;
  let mn=Math.min(...data), mx=Math.max(...data);
  if(mn===mx){mn-=1;mx+=1;}
  const xs=i=>pad+(i/(data.length-1))*(w-2*pad);
  const ys=v=>h-pad-(v-mn)/(mx-mn)*(h-2*pad);
  const pts=data.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`);
  const darr=a.type==="housing"?a.months:(a.dates||[]), dseg=darr.slice(-n);
  const tips=JSON.stringify(data.map((v,i)=>({d:dseg[i]||"",v,x:+xs(i).toFixed(1),y:+ys(v).toFixed(1)})));
  const color=a.chgCls==="up"?"#e0453a":a.chgCls==="down"?"#2fa877":"#7f96a8";
  const lab=a.type==="housing"?"近12月":(a.type==="fxrmb"?"近"+n+"日":"近30日");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" data-tips='${tips}'>
    <path d="M${pts.join(" L")}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xs(0).toFixed(1)}" cy="${ys(data[0]).toFixed(1)}" r="2" fill="${color}" opacity=".55"/>
    <circle cx="${xs(data.length-1).toFixed(1)}" cy="${ys(data[data.length-1]).toFixed(1)}" r="2.6" fill="${color}"/>
  </svg><span class="mlab">${lab} ${a.chgCls==="up"?"▲":a.chgCls==="down"?"▼":"—"}</span>`;
}
function fundMini(a){

  let bars="";
  fs.forEach((f,i)=>{

function fundWaveSVG(f, w, h){
  if(!f.hist||f.hist.length<2) return "";
  const data=f.hist;
  const W=w||300,H=h||72,pad=4;
  let mn=Math.min(...data), mx=Math.max(...data);
  if(mn===mx){mn-=1;mx+=1;}
  const xs=i=>pad+(i/(data.length-1))*(W-2*pad);
  const ys=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad);
  const pts=data.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`);
  const up=data[data.length-1]>=data[0];
  const color=up?"#e0453a":"#2fa877";
  const tips=JSON.stringify(data.map((v,i)=>({d:(f.histDates&&f.histDates[i])||"",v,x:+xs(i).toFixed(1),y:+ys(v).toFixed(1)})));
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-tips='${tips}'>
    <path d="M${pts.join(" L")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${xs(0).toFixed(1)}" cy="${ys(data[0]).toFixed(1)}" r="2.4" fill="${color}" opacity=".6"/>
    <circle cx="${xs(data.length-1).toFixed(1)}" cy="${ys(data[data.length-1]).toFixed(1)}" r="3.2" fill="${color}"/>
  </svg>`;
}
function fundRangePct(f){

      dataZoom:[{type:"inside",start:20,end:100},{type:"slider",height:16,bottom:4,start:20,end:100,borderColor:"#1e3345"}],
      series:[
        {name:"K线",type:"candlestick",data:ohlcData,
         itemStyle:{color:up,color0:down,borderColor:up,borderColor0:down}},
        {name:"MA5",type:"line",data:ma(5),smooth:true,symbol:"none",lineStyle:{width:1.4,color:"#e0a94f"}},
        {name:"MA10",type:"line",data:ma(10),smooth:true,symbol:"none",lineStyle:{width:1.2,color:"#5aa9e6"}},
        ...(isGold&&rmbG.length?[{name:"人民币金价(元/克)",type:"line",data:rmbG,smooth:true,symbol:"none",
           yAxisIndex:1,lineStyle:{width:1.8,color:"#c05ae0"},itemStyle:{color:"#c05ae0"}}]:[])
      ]
    };
  }
  chart.setOption(opt,true);
  window.addEventListener("resize",()=>chart&&chart.resize());
}
function show(id){
  activeId=id;
  const a=ASSETS.find(x=>x.id===id);
  renderCards(); renderTabs(); renderDetail(a); drawChart(a);
}
/* ---------- 迷你图悬停浮层 + 坐标参考线（即时显示日期+数值） ---------- */
(function(){
  const tip=document.createElement("div");
  tip.id="miniTip";
  tip.style.cssText="position:fixed;z-index:99999;pointer-events:none;display:none;background:rgba(8,18,28,.96);border:1px solid #2a4a62;border-radius:6px;padding:4px 9px;font-size:11.5px;color:#d5e8f5;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.45);";
  document.body.appendChild(tip);
  let lastSvg=null;
  function hideRef(){
    if(lastSvg){
      const r=lastSvg.querySelector(".mini-ref"), d=lastSvg.querySelector(".mini-dot");
      if(r) r.setAttribute("display","none");
      if(d) d.setAttribute("display","none");
      lastSvg=null;
    }
    tip.style.display="none";
  }
  document.addEventListener("mousemove",e=>{
    const svg=e.target.closest?e.target.closest("svg[data-tips]"):null;
    if(!svg){ hideRef(); return; }
    let tips=null;
    try{ tips=JSON.parse(svg.getAttribute("data-tips")); }catch(err){ tips=null; }
    if(!tips||!tips.length){ hideRef(); return; }
    const r=svg.getBoundingClientRect();
    if(r.width<=0) return;
    let idx=Math.round((e.clientX-r.left)/(r.width)*(tips.length-1));
    idx=Math.max(0,Math.min(tips.length-1,idx));
    const t=tips[idx];
    // 坐标参考线 + 数据点标记（画在 SVG 内部坐标系）
    let ref=svg.querySelector(".mini-ref"), dot=svg.querySelector(".mini-dot");
    if(!ref){
      const ns="http://www.w3.org/2000/svg";
      ref=document.createElementNS(ns,"line"); ref.setAttribute("class","mini-ref");
      ref.setAttribute("stroke","#5aa9e6"); ref.setAttribute("stroke-dasharray","3,3"); ref.setAttribute("stroke-width","1.1");
      svg.appendChild(ref);
      dot=document.createElementNS(ns,"circle"); dot.setAttribute("class","mini-dot");
      dot.setAttribute("r","3.2"); dot.setAttribute("fill","#ffd166"); dot.setAttribute("stroke","#0b1520"); dot.setAttribute("stroke-width","1.2");
      svg.appendChild(dot);
    }
    const vb=(svg.getAttribute("viewBox")||"0 0 96 44").split(/\s+/), vh=+vb[3];
    ref.setAttribute("display","");
    dot.setAttribute("display","");
    ref.setAttribute("x1",t.x); ref.setAttribute("x2",t.x); ref.setAttribute("y1",0); ref.setAttribute("y2",vh);
    dot.setAttribute("cx",t.x); dot.setAttribute("cy",t.y);
    lastSvg=svg;
    // 数值浮层
    tip.textContent=t.d+"  "+t.v;
    tip.style.display="block";
    let lx=e.clientX+14, ty=e.clientY-12;
    const tw=tip.offsetWidth;
    if(lx+tw>window.innerWidth-6) lx=e.clientX-tw-14;
    if(ty<6) ty=6;
    tip.style.left=lx+"px"; tip.style.top=ty+"px";
  });
  document.addEventListener("mouseleave",hideRef);
})();
function init(){
  activeId=ASSETS[0].id;
  renderHeader(); renderCards(); renderTabs(); renderDetail(ASSETS[0]); drawChart(ASSETS[0]);
  const fn=$("footnote");
  fn.innerHTML=`<b>数据说明：</b>本看板展示每日美股交易日资产监控日报，数据日期为最近一个交易日收盘（${DATA_DATE}）。当前为自包含静态看板，ECharts 在浏览器端渲染 K 线/趋势图，不依赖图片文件。新增一期数据时，修改页面顶部 <b>ASSETS</b> 数据对象的 <b>ohlc / hprice / hrent / price / chg / rows</b> 字段后刷新即可，图表自动更新。<br><b>K线颜色：</b>红涨绿跌（中国习惯）；<b>债券收益率</b>：收益率上升=红（债券跌），收益率下降=绿（债券涨）。房价为近12个月双轴折线（左轴房价、右轴租金）。`;
}
window.addEventListener("DOMContentLoaded",init);
</script>
